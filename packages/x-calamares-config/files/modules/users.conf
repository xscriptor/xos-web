---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: nopasswdlogin
      must_exist: false
      system: true
sudoersGroup:    wheel
autologinGroup:  autologin
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
displayAutologin:   true
doAutologin:     true
passwordRequirements:
    minLength: 8
    libpwquality:
        - minlen=8
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/zsh
  forbidden_names: [ root ]
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "x-${cpu}"
